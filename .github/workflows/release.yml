name: Release

# 推一個 v 開頭的 tag,就 build 前後端的出貨 image 並推到 GitHub Container Registry。
# image 的 tag 與 git tag 相同,latest 也指到這一版。發版步驟見 docs/development.md 的 Release 一節
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # 後端只出 amd64:pyEDM 1.15.4 在 PyPI 上沒有 arm64 的 Linux wheel
          - service: backend
            platforms: linux/amd64
          # 前端的 build stage 跑在 runner 的原生架構,最後一個 stage 只複製檔案,
          # 所以出 arm64 不需要模擬
          - service: frontend
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # image 名稱是 ghcr.io/<owner>/<repo>-<service>,metadata-action 會轉成小寫。
      # 它產生的 OCI label 記下來源 repo、版本與 commit
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: type=ref,event=tag
      # 沒指定 target:後端的 Dockerfile 最後一個 stage 就是出貨用的 runtime
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
