# 自架用的 compose 檔:從 container registry 拉 Release 的 image 啟動服務,不需要原始碼與 build 環境。
# 自架者只需要這個檔與 .env。本機開發由 compose.local.yaml 疊在上面,改成從原始碼 build。
# .env 的 VERSION 決定拉哪一個版本;留空時拉 latest,也就是最近一次發佈的 Release。
services:
  backend:
    image: ghcr.io/aj006600/mdrsmap-classifier-backend:${VERSION:-latest}
    # 後端固定跑 linux/amd64:pyEDM 1.15.4 在 PyPI 上只有 x86_64 的 Linux wheel,
    # 沒有 arm64 的 wheel,也沒有 sdist。在 arm64 的主機上由 Docker 模擬執行,比原生慢。
    platform: linux/amd64
    restart: unless-stopped
    # 唯一的設定來源,不進版控。本機開發時缺檔由 make 從 .env.example 複製,自架者則自己複製。
    # ENV_FILE 只給清理用的 make target 改指到進版控的 .env.example:清理不該因為缺 .env 而失敗。
    env_file:
      - ${ENV_FILE:-.env}
    # SQLite 資料庫放在 /data(見 backend/app/main.py 的 DATABASE)。
    # 放在 named volume 裡,服務重啟、container 重建或換成新版本的 image 後,算過的結果還在
    volumes:
      - data:/data
    # 埠只發佈到 loopback,同一個網路上的別台機器連不到。網頁經由 frontend 的 nginx 呼叫 /api;
    # 後端自己的埠給健康檢查(/health)與 API 文件(/docs)用。
    # 埠被占用時,在 shell 或 .env 設定 PORT 或 FRONTEND_PORT,改用別的埠
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    # healthcheck 用 python 是因為 bookworm-slim 沒有 curl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    image: ghcr.io/aj006600/mdrsmap-classifier-frontend:${VERSION:-latest}
    restart: unless-stopped
    # 等 backend healthy 再起 nginx,否則 uvicorn 未 listen 前 /api 會回 502
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"

volumes:
  data:
